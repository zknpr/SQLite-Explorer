version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned =1.110.0: must not exceed engines.vscode (^1.110.0) or vsce
      # refuses to package. Raise together with a deliberate engines bump.
      - dependency-name: "@types/vscode"
      # TS 7 (native compiler) is a toolchain migration, not a routine bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
